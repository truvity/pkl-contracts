# Calls the shared workflow (truvity/ci-workflows), which runs each Justfile
# recipe as its OWN parallel job, reported under its own name.
#
# Pinned by COMMIT SHA, never a tag — tags move, and this code runs in every
# repository of both organizations.
#
# Hosted runners only, and not by accident: a public repository's pull
# requests come from forks, and a fork's code must never execute on the
# estate's own infrastructure. The shared workflow's default runner is
# `ubuntu-latest`, so this caller names none.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recipes:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@b38472fac2bff567c7b138654cebc7da485170ca # v3.26.1
    with:
      # The component contract is judged, shown in the job summary, and
      # enforced: a rule that fails fails the check.
      policy-conformance: true
      policy-conformance-strict: true
      # `vuln` is not here: it runs in security.yaml, on a schedule, where a
      # change upstream is reported without turning every pull request red
      # (the component contract's C10).
      #
      # `conformance` and `conformance-kotlin` are two jobs because Gradle makes
      # Kotlin the slow part of the cross-language suite: the first reports the
      # other engines without waiting for it.
      recipes: '["test", "lint", "example", "package", "leak-canary", "generated", "compat", "conformance", "conformance-kotlin"]'

  # Stable name for branch protection: the matrix reports as "recipes / test"
  # and so on, so a required context called "check" would never arrive and
  # every pull request would hang waiting for it.
  check:
    needs: recipes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: '[ "${{ needs.recipes.result }}" = "success" ]'
