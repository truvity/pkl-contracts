# Releases every package in packages/ on a `vX.Y.Z` tag, through the shared
# workflow (truvity/ci-workflows): the tag must equal the version in
# packages/Release.pkl and have its CHANGELOG heading; `just package` builds
# the assets; each is uploaded to the GitHub Release under its exact name, and
# each package is then resolved from github.com to prove a consumer can.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    uses: truvity/ci-workflows/.github/workflows/release-pkl.yaml@a687cf1469cf4789e218ed25625abe25e722431d # v3.24.1
    with:
      version-command: sed -n 's/^version = "\(.*\)"$/\1/p' packages/Release.pkl
      pkl-command: bin/pkl
      smoke-import: |
        contracts.vocab#/Vocab.pkl
        contracts.fragments#/Fragments.pkl
        contracts.templates#/ServiceConfig.pkl
