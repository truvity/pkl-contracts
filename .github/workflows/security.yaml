# What this repository trusts from outside, checked daily: the `vuln` recipe,
# through the same shared workflow that runs every other recipe. There is no Go
# module here, so the recipe is not govulncheck: it confirms that the checksums
# bin/pkl pins are the digests GitHub publishes for the Pkl release it fetches.
#
# Deliberately NOT in ci.yaml's recipe list, NOT in `just check`, and not a
# required context (the component contract's C10). An upstream change is news
# about the world, not about the change under review, and a failure here with no
# fix to hand would otherwise turn every pull request red.
#
# Pinned by COMMIT SHA with the tag in a comment, like every other caller.
name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  vuln:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@b38472fac2bff567c7b138654cebc7da485170ca # v3.26.1
    with:
      recipes: '["vuln"]'
