config:
  probes:
    address: :7070
  listen:
    address: :8080
  postgres:
    url: postgres://echo@db.example.com:5432/echo?sslmode=require
    maxConnections: 10
  retention:
    days: 30
    keepForever: false
  labels:
    team: platform
  archive:
    prefix: echo/requests
    batchSeconds: 60
  client:
    timeoutSeconds: 5
    retry:
      attempts: 3
      idempotentOnly: true
images:
  echo:
    registry: registry.example.com
    repository: example/echo
    tag: ''
    digest: ''
resources:
  requests:
    cpu: 50m
    memory: 64Mi
